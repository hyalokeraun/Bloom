# Server Configuration
# =====================

[server]
port = 8080
host = 0.0.0.0
threads = 8
log_file = server.log
log_level = info
max_body_size = 4194304
keep_alive_timeout = 65

[cors]
enabled = true
allowed_origins = *
allowed_methods = GET, POST, PUT, DELETE, OPTIONS, PATCH
allowed_headers = Content-Type, Authorization
